<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Research | Nicolo's Collection</title>
    <meta name="description" content="A curated collection of interesting articles, videos, and ideas worth exploring.">
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #12121a;
            --surface-hover: #1a1a24;
            --text: #e4e4e7;
            --text-muted: #a1a1aa;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.15);
            --border: rgba(255,255,255,0.08);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }
        
        .hero {
            text-align: center;
            padding: 5rem 2rem 3rem;
            background: linear-gradient(180deg, var(--surface) 0%, var(--bg) 100%);
            border-bottom: 1px solid var(--border);
        }
        
        .hero h1 {
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: 800;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #fff 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .hero p {
            color: var(--text-muted);
            font-size: 1.15rem;
            max-width: 500px;
            margin: 0 auto;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }
        
        .section-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        
        .section-header h2 {
            font-size: 1.5rem;
            font-weight: 600;
        }
        
        .section-header .count {
            background: var(--accent-glow);
            color: var(--accent);
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            font-size: 0.875rem;
            font-weight: 500;
        }
        
        .articles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
        }
        
        .article-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.75rem;
            text-decoration: none;
            color: inherit;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        
        .article-card:hover {
            background: var(--surface-hover);
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px var(--accent-glow);
        }
        
        .card-header {
            display: flex;
            align-items: flex-start;
            gap: 1rem;
        }
        
        .card-emoji {
            font-size: 2rem;
            line-height: 1;
        }
        
        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            line-height: 1.3;
        }
        
        .card-description {
            color: var(--text-muted);
            font-size: 0.95rem;
            flex-grow: 1;
        }
        
        .card-meta {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }
        
        .source-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.3rem 0.6rem;
            background: rgba(255,255,255,0.05);
            border-radius: 6px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        
        .source-badge.tiktok { color: #ff0050; }
        .source-badge.youtube { color: #ff0000; }
        .source-badge.article { color: #22c55e; }
        
        .date {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-left: auto;
        }
        
        .tags {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        
        .tag {
            padding: 0.2rem 0.5rem;
            background: var(--accent-glow);
            color: var(--accent);
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 500;
        }
        
        footer {
            text-align: center;
            padding: 3rem 2rem;
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        
        @media (max-width: 480px) {
            .articles-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header class="hero">
        <h1>🔬 AI Research</h1>
        <p>A curated collection of interesting articles, videos, and rabbit holes worth exploring</p>
    </header>
    
    <main class="container">
        <div class="section-header">
            <h2>Articles</h2>
            <span class="count" id="article-count">Loading...</span>
        </div>
        
        <div class="articles-grid" id="articles-grid">
            <!-- Articles loaded dynamically -->
        </div>
    </main>
    
    <footer>
        <p>Curated by Nicolo · Powered by curiosity</p>
    </footer>
    
    <script>
        const sourceIcons = {
            tiktok: '📱',
            youtube: '▶️',
            article: '📄',
            podcast: '🎙️'
        };
        
        async function loadArticles() {
            try {
                const res = await fetch('/articles.json');
                const data = await res.json();
                
                document.getElementById('article-count').textContent = data.articles.length + ' entries';
                
                const grid = document.getElementById('articles-grid');
                grid.innerHTML = data.articles.map(article => `
                    <a href="/articles/${article.slug}/" class="article-card">
                        <div class="card-header">
                            <span class="card-emoji">${article.emoji}</span>
                            <h3 class="card-title">${article.title}</h3>
                        </div>
                        <p class="card-description">${article.description}</p>
                        <div class="tags">
                            ${article.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                        </div>
                        <div class="card-meta">
                            <span class="source-badge ${article.source}">
                                ${sourceIcons[article.source] || '📄'} ${article.source}
                            </span>
                            <span class="date">${new Date(article.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}</span>
                        </div>
                    </a>
                `).join('');
            } catch (e) {
                console.error('Failed to load articles:', e);
            }
        }
        
        loadArticles();
    </script>
</body>
</html>
