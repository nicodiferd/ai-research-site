<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Research | Nicolo's Collection</title>
    <meta name="description" content="A curated collection of interesting articles, videos, and ideas worth exploring.">
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #12121a;
            --surface-hover: #1a1a24;
            --text: #e4e4e7;
            --text-muted: #a1a1aa;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.15);
            --border: rgba(255,255,255,0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        .hero {
            text-align: center;
            padding: 5rem 2rem 3rem;
            background: linear-gradient(180deg, var(--surface) 0%, var(--bg) 100%);
            border-bottom: 1px solid var(--border);
        }

        .hero h1 {
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: 800;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #fff 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1.15rem;
            max-width: 500px;
            margin: 0 auto;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }

        /* ── Filters ── */
        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
            margin-bottom: 2rem;
        }

        .search-wrap {
            position: relative;
            flex: 1;
            min-width: 200px;
        }

        .search-wrap svg {
            position: absolute;
            left: 0.9rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        #search {
            width: 100%;
            padding: 0.65rem 1rem 0.65rem 2.5rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        #search::placeholder { color: var(--text-muted); }
        #search:focus { border-color: var(--accent); }

        .source-pills {
            display: flex;
            gap: 0.4rem;
        }

        .pill {
            padding: 0.55rem 1rem;
            border-radius: 99px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-muted);
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .pill:hover { border-color: var(--accent); color: var(--text); }
        .pill.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .date-filters {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .date-filters label {
            font-size: 0.8rem;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .date-filters input[type="date"] {
            padding: 0.55rem 0.75rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 0.875rem;
            outline: none;
            transition: border-color 0.2s;
            color-scheme: dark;
        }

        .date-filters input[type="date"]:focus { border-color: var(--accent); }

        .clear-btn {
            padding: 0.55rem 0.9rem;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-muted);
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .clear-btn:hover { border-color: var(--accent); color: var(--accent); }

        /* ── Section header ── */
        .section-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .section-header h2 { font-size: 1.5rem; font-weight: 600; }

        .count {
            background: var(--accent-glow);
            color: var(--accent);
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            font-size: 0.875rem;
            font-weight: 500;
        }

        /* ── Grid ── */
        .articles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
        }

        .article-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.75rem;
            text-decoration: none;
            color: inherit;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .article-card:hover {
            background: var(--surface-hover);
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px var(--accent-glow);
        }

        .card-header { display: flex; align-items: flex-start; gap: 1rem; }
        .card-emoji { font-size: 2rem; line-height: 1; }
        .card-title { font-size: 1.25rem; font-weight: 600; line-height: 1.3; }
        .card-description { color: var(--text-muted); font-size: 0.95rem; flex-grow: 1; }

        .card-meta {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }

        .source-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.3rem 0.6rem;
            background: rgba(255,255,255,0.05);
            border-radius: 6px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .source-badge.tiktok { color: #ff0050; }
        .source-badge.youtube { color: #ff0000; }
        .source-badge.instagram { color: #e1306c; }
        .source-badge.article { color: #22c55e; }

        .date { font-size: 0.8rem; color: var(--text-muted); margin-left: auto; }

        .tags { display: flex; gap: 0.5rem; flex-wrap: wrap; }

        .tag {
            padding: 0.2rem 0.5rem;
            background: var(--accent-glow);
            color: var(--accent);
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
        }

        .empty p { font-size: 1rem; margin-top: 0.5rem; }

        footer {
            text-align: center;
            padding: 3rem 2rem;
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            .articles-grid { grid-template-columns: 1fr; }
            .filters { flex-direction: column; align-items: stretch; }
            .date-filters { flex-wrap: wrap; }
        }
    </style>
</head>
<body>
    <header class="hero">
        <h1>🔬 AI Research</h1>
        <p>A curated collection of interesting articles, videos, and rabbit holes worth exploring</p>
    </header>

    <main class="container">
        <div class="filters">
            <!-- Search -->
            <div class="search-wrap">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <input type="text" id="search" placeholder="Search articles…" autocomplete="off">
            </div>

            <!-- Source filter -->
            <div class="source-pills">
                <button class="pill active" data-source="all">All</button>
                <button class="pill" data-source="tiktok">📱 TikTok</button>
                <button class="pill" data-source="youtube">▶️ YouTube</button>
                <button class="pill" data-source="instagram">📸 Instagram</button>
            </div>

            <!-- Date filter -->
            <div class="date-filters">
                <label>From</label>
                <input type="date" id="date-from">
                <label>To</label>
                <input type="date" id="date-to">
            </div>

            <button class="clear-btn" id="clear-btn">Clear filters</button>
        </div>

        <div class="section-header">
            <h2>Articles</h2>
            <span class="count" id="article-count">Loading…</span>
        </div>

        <div class="articles-grid" id="articles-grid"></div>
    </main>

    <footer>
        <p>Curated by Nicolo · Powered by curiosity</p>
    </footer>

    <script>
        const sourceIcons = { tiktok: '📱', youtube: '▶️', instagram: '📸', article: '📄', podcast: '🎙️' };

        let allArticles = [];
        let activeSource = 'all';

        const searchEl   = document.getElementById('search');
        const dateFrom   = document.getElementById('date-from');
        const dateTo     = document.getElementById('date-to');
        const grid       = document.getElementById('articles-grid');
        const countEl    = document.getElementById('article-count');
        const clearBtn   = document.getElementById('clear-btn');

        // Source pill logic
        document.querySelectorAll('.pill[data-source]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.pill[data-source]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                activeSource = btn.dataset.source;
                render();
            });
        });

        searchEl.addEventListener('input', render);
        dateFrom.addEventListener('change', render);
        dateTo.addEventListener('change', render);

        clearBtn.addEventListener('click', () => {
            searchEl.value = '';
            dateFrom.value = '';
            dateTo.value = '';
            activeSource = 'all';
            document.querySelectorAll('.pill[data-source]').forEach(b => b.classList.remove('active'));
            document.querySelector('.pill[data-source="all"]').classList.add('active');
            render();
        });

        function render() {
            const query = searchEl.value.trim().toLowerCase();
            const from  = dateFrom.value ? new Date(dateFrom.value) : null;
            const to    = dateTo.value   ? new Date(dateTo.value + 'T23:59:59') : null;

            const filtered = allArticles.filter(a => {
                if (activeSource !== 'all' && a.source !== activeSource) return false;

                const date = new Date(a.date);
                if (from && date < from) return false;
                if (to   && date > to)   return false;

                if (query) {
                    const haystack = [a.title, a.description, ...(a.tags || [])].join(' ').toLowerCase();
                    if (!haystack.includes(query)) return false;
                }

                return true;
            });

            countEl.textContent = filtered.length + ' ' + (filtered.length === 1 ? 'entry' : 'entries');

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="empty"><span style="font-size:2rem">🔍</span><p>No articles match your filters.</p></div>`;
                return;
            }

            grid.innerHTML = filtered.map(a => `
                <a href="/articles/${a.slug}/" class="article-card">
                    <div class="card-header">
                        <span class="card-emoji">${a.emoji}</span>
                        <h3 class="card-title">${a.title}</h3>
                    </div>
                    <p class="card-description">${a.description}</p>
                    <div class="tags">
                        ${(a.tags || []).map(t => `<span class="tag">${t}</span>`).join('')}
                    </div>
                    <div class="card-meta">
                        <span class="source-badge ${a.source}">
                            ${sourceIcons[a.source] || '📄'} ${a.source}
                        </span>
                        <span class="date">${new Date(a.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}</span>
                    </div>
                </a>
            `).join('');
        }

        async function loadArticles() {
            try {
                const res  = await fetch('/articles.json');
                const data = await res.json();
                allArticles = data.articles;
                render();
            } catch (e) {
                grid.innerHTML = `<div class="empty"><p>Failed to load articles.</p></div>`;
                console.error(e);
            }
        }

        loadArticles();
    </script>
</body>
</html>
